[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
  "artifacts",
  "portal/node_modules",
  "scripts/research/mobrecon/source",
]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests", "portal/test"]
pythonpath = ["."]
